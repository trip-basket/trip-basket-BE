plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.3.0'
}

group = 'dev.jino'
version = '0.0.1-SNAPSHOT'
description = 'trip-basket-new'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

spotless {
    lineEndings 'UNIX'

    java {
        palantirJavaFormat()
        removeUnusedImports()
        importOrder(
                'java',
                'javax',
                'org',
                'com',
                '',
                '\\#'
        )
        endWithNewline()
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // 문서
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('placeClientLiveTest', Test) {
    group = 'verification'
    description = 'Runs the live Google Places/Timezone integration test using environment variables.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/PlaceClientLiveIntegrationTest.class'
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
    }
}

tasks.named('processResources') {
    from('docs') {
        include 'api-changelog.md'
        into 'changelog'
        rename { 'changelog.md' }
    }
}
