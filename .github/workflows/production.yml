name: Deploy to OCI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # 1. 코드 가져오기
      - name: Checkout sources
        uses: actions/checkout@v3

      # 2. JDK 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 빌드 (JAR 파일 생성)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Create .env file from Secret Blob
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env
            

      # 5. 파일 전송 (SCP) -> JAR와 .env만 전송
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          source: "build/libs/*.jar,.env"
          target: "/home/${{ secrets.OCI_USERNAME }}/deploy_temp"
          strip_components: 0

      # 6. 배포 실행 (SSH)
      - name: Deploy on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          script: |
            # 1. 파일 이동 (임시 폴더 -> 실제 폴더)
            # JAR 덮어쓰기
            mv ~/deploy_temp/build/libs/*.jar ~/server/app.jar
            # .env 덮어쓰기
            mv ~/deploy_temp/.env ~/server/.env
            
            # 임시 폴더 삭제
            rm -rf ~/deploy_temp
            
            # 2. Docker 재배포
            cd ~/server
            
            # 기존 컨테이너 중지
            docker compose stop spring-app
            
            # 이미지 새로 빌드(app.jar가 바뀌었으므로) 및 실행
            docker compose up -d --build spring-app
            
            # 불필요한 이미지 정리
            docker image prune -f