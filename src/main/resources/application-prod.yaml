spring:
  datasource:
    url: ${PROD_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${PROD_DB_USERNAME}
    password: ${PORD_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

server:
  forward-headers-strategy: framework
