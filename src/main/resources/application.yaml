spring:
  application:
    name: trip-basket-new
  profiles:
    active: dev

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            scope:
              - email
              - profile

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    config-url: /api-docs/swagger-config
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    places:
      base-url: https://places.googleapis.com/v1/places
      field-mask: "id,displayName,formattedAddress,location,regularOpeningHours,priceLevel,photos,primaryType,types"
      language-code: ko
      photo-max-height-px: 800

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}
  auth-cookie:
    name: ${AUTH_COOKIE_NAME:access_token}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    path: /
    domain: ${AUTH_COOKIE_DOMAIN:}
    redirect-uri: ${AUTH_REDIRECT_URI:http://localhost:3000/}
